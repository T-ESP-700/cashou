name: CI/CD Monorepo

on:
  push:
  pull_request:
  workflow_dispatch:  # Permet le déclenchement manuel pour le deploy

jobs:
  # Installation des dépendances du workspace
  install-deps:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

  # Vérification de la qualité du code pour tout le monorepo
  code-quality:
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bun run typecheck
      - name: Code quality
        run: bunx eslint . --ext .ts,.tsx
        working-directory: apps/backend

  # Tests des packages partagés (uniquement ceux qui ont des tests)
  shared-packages-test:
    runs-on: ubuntu-latest
    needs: install-deps
    strategy:
      matrix:
        package: ['@cashou/db-app', '@cashou/db-backoffice']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Test ${{ matrix.package }}
        run: bun run --filter ${{ matrix.package }} test
        continue-on-error: true

  # Build des packages partagés
  shared-packages-build:
    runs-on: ubuntu-latest
    needs: install-deps
    strategy:
      matrix:
        package: ['@cashou/db-app', '@cashou/db-backoffice', '@cashou/auth', '@cashou/api', '@cashou/ui', '@cashou/utils']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Build ${{ matrix.package }}
        run: bun run --filter ${{ matrix.package }} build
        continue-on-error: true

  # Tests des applications
  apps-test:
    runs-on: ubuntu-latest
    needs: install-deps
    strategy:
      matrix:
        app: ['backend', 'backoffice']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Test ${{ matrix.app }}
        run: bun run --filter ${{ matrix.app }} test
        continue-on-error: true

  # Tests API spécifiques pour le backend
  backend-api-test:
    runs-on: ubuntu-latest
    needs: [install-deps, db-app-migrate]
    env:
      CASHOU_DB_URL: postgresql://postgres:password@localhost:5432/cashou_db?schema=public
      BACKOFFICE_DB_URL: postgresql://postgres:password@localhost:5433/backoffice_db?schema=public
    services:
      postgres-app:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cashou_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      postgres-backoffice:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: backoffice_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Generate Prisma client for app database
        run: bun run db:generate:app
      - name: Generate Prisma client for backoffice database
        run: bun run db:generate:backoffice
      - name: Run migrations for app database
        run: bun run db:migrate:app
      - name: Run migrations for backoffice database
        run: bun run db:migrate:backoffice
      # Note: Ne pas démarrer de serveur ici - les tests (trpc.test.ts, api.test.ts)
      # démarrent leur propre serveur sur le port 3000
      - name: Run API tests
        run: bun run --filter backend test --timeout 30000

  # Build des applications
  apps-build:
    runs-on: ubuntu-latest
    needs: [install-deps, backend-api-test]
    strategy:
      matrix:
        app: ['backend', 'backoffice']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Generate Prisma clients
        run: |
          bun run db:generate:app
          bun run db:generate:backoffice
      - name: Type-check & build ${{ matrix.app }}
        run: bun run --filter ${{ matrix.app }} build

  # Migrations de la base de données application
  db-app-migrate:
    runs-on: ubuntu-latest
    needs: install-deps
    env:
      CASHOU_DB_URL: postgresql://postgres:password@localhost:5432/cashou_db?schema=public
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cashou_db
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Generate Prisma client for app database
        run: bun run db:generate:app
      - name: Run migrations for app database
        run: bun run db:migrate:app

  # Migrations de la base de données backoffice
  db-backoffice-migrate:
    runs-on: ubuntu-latest
    needs: install-deps
    env:
      BACKOFFICE_DB_URL: postgresql://postgres:password@localhost:5433/backoffice_db?schema=public
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: backoffice_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Generate Prisma client for backoffice database
        run: bun run db:generate:backoffice
      - name: Run migrations for backoffice database
        run: bun run db:migrate:backoffice

  # Build et push des images Docker
  docker-build:
    runs-on: ubuntu-latest
    needs: [apps-build, shared-packages-build, db-app-migrate, db-backoffice-migrate]
    strategy:
      matrix:
        service: ['backend', 'backoffice']
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image for ${{ matrix.service }}
        run: |
          docker build -t cashou-${{ matrix.service }}:latest -f ./apps/${{ matrix.service }}/Dockerfile .
      - name: Push Docker image
        run: |
          echo "Pushing cashou-${{ matrix.service }}:latest"

  # Déploiement (placeholder - à configurer avec un vrai serveur/registry)
  deploy:
    needs: [docker-build]
    runs-on: ubuntu-latest
    # Ne s'exécute que sur main et en mode manuel
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy placeholder
        run: |
          echo "Deploy job triggered on main branch"
          echo "TODO: Configure actual deployment (push to registry, deploy to server)"
          echo "Skipping docker compose in CI - requires real infrastructure"
