name: CI/CD Monorepo

on:
  push:
  pull_request:

jobs:
  # Installation des dépendances du workspace
  install-deps:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

  # Vérification de la qualité du code pour tout le monorepo
  code-quality:
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Generate Prisma client for app database
        run: bun run db:generate:app
      - name: Generate Prisma client for backoffice database
        run: bun run db:generate:backoffice
      - name: TypeScript check
        run: bun run typecheck
      - name: Code quality
        run: bunx eslint apps/backend --ext .ts,.tsx

  # Tests des packages partagés (uniquement ceux qui ont des tests)
  shared-packages-test:
    runs-on: ubuntu-latest
    needs: install-deps
    strategy:
      matrix:
        package: ['@cashou/db-app', '@cashou/db-backoffice']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Test ${{ matrix.package }}
        run: bun run --filter ${{ matrix.package }} test
        continue-on-error: true

  # Build des packages partagés
  shared-packages-build:
    runs-on: ubuntu-latest
    needs: install-deps
    strategy:
      matrix:
        package: ['@cashou/db-app', '@cashou/db-backoffice', '@cashou/auth', '@cashou/api', '@cashou/ui', '@cashou/utils']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Build ${{ matrix.package }}
        run: bun run --filter ${{ matrix.package }} build
        continue-on-error: true

  # Tests des applications (uniquement celles qui ont des tests)
  apps-test:
    runs-on: ubuntu-latest
    needs: install-deps
    env:
      SKIP_PRISMA_INIT: "true"  # Évite l'initialisation Prisma pour les tests unitaires
    strategy:
      matrix:
        app: ['backend']  # backoffice n'a pas encore de tests
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Generate Prisma clients
        run: |
          bunx prisma generate --schema=packages/@cashou/db-app/prisma/schema.prisma
          bunx prisma generate --schema=packages/@cashou/db-backoffice/prisma/schema.prisma
      - name: Test ${{ matrix.app }}
        run: bun run --filter ${{ matrix.app }} test

  # Tests API spécifiques pour le backend
  backend-api-test:
    runs-on: ubuntu-latest
    needs: [install-deps, db-app-migrate]
    env:
      CASHOU_DB_URL: postgresql://postgres:password@localhost:5432/cashou_db?schema=public
      BACKOFFICE_DB_URL: postgresql://postgres:password@localhost:5433/backoffice_db?schema=public
    services:
      postgres-app:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cashou_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      postgres-backoffice:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: backoffice_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Generate Prisma client for app database
        run: bun run db:generate:app
      - name: Generate Prisma client for backoffice database
        run: bun run db:generate:backoffice
      - name: Run migrations for app database
        run: bun run db:migrate:app
      - name: Run migrations for backoffice database
        run: bun run db:migrate:backoffice
      - name: Run API tests
        run: bun run --filter backend test --timeout 30000

  # Build des applications
  apps-build:
    runs-on: ubuntu-latest
    needs: [install-deps, backend-api-test]
    strategy:
      matrix:
        app: ['backend', 'backoffice']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Generate Prisma client for app database
        run: bun run db:generate:app
      - name: Generate Prisma client for backoffice database
        run: bun run db:generate:backoffice
      - name: Type-check & build ${{ matrix.app }}
        run: bun run --filter ${{ matrix.app }} build

  # Migrations de la base de données application
  db-app-migrate:
    runs-on: ubuntu-latest
    needs: install-deps
    env:
      CASHOU_DB_URL: postgresql://postgres:password@localhost:5432/cashou_db?schema=public
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cashou_db
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Generate Prisma client for app database
        run: bun run db:generate:app
      - name: Run migrations for app database
        run: bun run db:migrate:app

  # Migrations de la base de données backoffice
  db-backoffice-migrate:
    runs-on: ubuntu-latest
    needs: install-deps
    env:
      BACKOFFICE_DB_URL: postgresql://postgres:password@localhost:5433/backoffice_db?schema=public
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: backoffice_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Generate Prisma client for backoffice database
        run: bun run db:generate:backoffice
      - name: Run migrations for backoffice database
        run: bun run db:migrate:backoffice

  # Build et push des images Docker
  docker-build:
    runs-on: ubuntu-latest
    needs: [apps-build, shared-packages-build, db-app-migrate, db-backoffice-migrate]
    strategy:
      matrix:
        service: ['backend', 'backoffice']
    steps:
      - uses: actions/checkout@v4
      - name: Create .env.docker file
        run: |
          cat > .env.docker << 'EOF'
          # CAShOU database (Docker configuration)
          CASHOU_DB_URL="postgresql://postgres:password@db_cashou:5432/cashou_db"
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=password
          POSTGRES_DB=cashou_db

          # BACKOFFICE database (Docker configuration)
          BACKOFFICE_DB_URL="postgresql://postgres:password@db_backoffice:5432/backoffice"

          # Supabase
          VITE_SUPABASE_URL=https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY=placeholder_key

          # Better-Auth
          BETTER_AUTH_SECRET=ci_placeholder_secret_32chars_long
          BETTER_AUTH_URL=http://localhost:3000
          GOOGLE_CLIENT_ID=
          GOOGLE_CLIENT_SECRET=
          EOF
      - name: Build Docker image for ${{ matrix.service }}
        run: |
          docker build -t cashou-${{ matrix.service }}:latest -f ./apps/${{ matrix.service }}/Dockerfile .
      - name: Push Docker image
        run: |
          echo "Pushing cashou-${{ matrix.service }}:latest"

