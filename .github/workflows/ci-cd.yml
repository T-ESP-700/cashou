name: CI/CD Monorepo Optimisé

on:
  push:
  pull_request:

jobs:
  # 1. Setup unique - Installation et génération Prisma
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      
      - name: Generate Prisma clients
        run: |
          bun run db:generate:app
          bun run db:generate:backoffice
      
      # Sauvegarder les clients Prisma générés pour les autres jobs
      - name: Upload Prisma artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prisma-clients
          path: |
            packages/@cashou/db-app/node_modules/.prisma
            packages/@cashou/db-backoffice/src/generated
          retention-days: 1

  # 2. Qualité du code
  code-quality:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      
      - name: Download Prisma artifacts
        uses: actions/download-artifact@v4
        with:
          name: prisma-clients
      
      - name: TypeScript check
        run: bun run typecheck
      
      - name: Lint backend
        run: bunx eslint apps/backend --ext .ts,.tsx

  # 3. Tests backend avec bases de données
  backend-test:
    runs-on: ubuntu-latest
    needs: setup
    env:
      CASHOU_DB_URL: postgresql://postgres:password@localhost:5432/cashou_db?schema=public
      BACKOFFICE_DB_URL: postgresql://postgres:password@localhost:5433/backoffice_db?schema=public
    services:
      postgres-app:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cashou_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      postgres-backoffice:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: backoffice_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      
      - name: Download Prisma artifacts
        uses: actions/download-artifact@v4
        with:
          name: prisma-clients
      
      - name: Run migrations
        run: |
          bun run db:migrate:app
          bun run db:migrate:backoffice
      
      - name: Run backend tests
        run: bun run --filter backend test --timeout 30000

  # 4. Build des applications
  apps-build:
    runs-on: ubuntu-latest
    needs: [code-quality, backend-test]
    strategy:
      matrix:
        app: ['backend', 'backoffice']
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      
      - name: Download Prisma artifacts
        uses: actions/download-artifact@v4
        with:
          name: prisma-clients
      
      - name: Build ${{ matrix.app }}
        run: bun run --filter ${{ matrix.app }} build

  # 5. Build et validation Docker (optionnel)
  docker-build:
    runs-on: ubuntu-latest
    needs: [apps-build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    strategy:
      matrix:
        service: ['backend', 'backoffice']
    steps:
      - uses: actions/checkout@v4
      
      - name: Create .env.docker file
        run: |
          cat > .env.docker << 'EOF'
          # CAShOU database (Docker configuration)
          CASHOU_DB_URL="postgresql://postgres:password@db_cashou:5432/cashou_db"
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=password
          POSTGRES_DB=cashou_db

          # BACKOFFICE database (Docker configuration)
          BACKOFFICE_DB_URL="postgresql://postgres:password@db_backoffice:5432/backoffice"

          # Supabase
          VITE_SUPABASE_URL=https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY=placeholder_key

          # Better-Auth
          BETTER_AUTH_SECRET=ci_placeholder_secret_32chars_long
          BETTER_AUTH_URL=http://localhost:3000
          GOOGLE_CLIENT_ID=
          GOOGLE_CLIENT_SECRET=
          EOF
      
      - name: Build Docker image for ${{ matrix.service }}
        run: |
          docker build -t cashou-${{ matrix.service }}:latest -f ./apps/${{ matrix.service }}/Dockerfile .
          echo "✅ Image cashou-${{ matrix.service }}:latest construite avec succès"

