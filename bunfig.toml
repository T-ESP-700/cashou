[workspace]
packages = [
  "apps/*",
  "packages/@cashou/*"
]

[install]
# Optimiser l'installation des dépendances
production = false
frozenLockfile = false

[test]
# Configuration des tests
# Coverage désactivé par défaut (utiliser `bun run test:coverage` pour l'activer)
coverage = false
# Seuil de coverage (appliqué uniquement avec --coverage)
coverageThreshold = 60